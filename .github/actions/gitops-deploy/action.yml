name: Deploy image tag to gitops
description: >
  Verify the image exists in ECR, then write its tag into the gitops repo branch
  for ENVIRONMENT. Shared by cd.yml (test) and promote.yml (test/prod). Run
  actions/checkout, arduino/setup-task and aws-actions/configure-aws-credentials
  first, and set ENVIRONMENT, IMAGE_TAG, SERVICE_NAME, ECR_REPOSITORY_NAME,
  ECS_GITOPS_REPO and ECS_GITOPS_PATH in the job env.

runs:
  using: composite
  steps:
    # A tag can be missing when a merge lands without CI having pushed the image
    # (admin bypass, a failed BUILD) or when a promote input is mistyped. Fail
    # before writing the gitops pointer rather than pointing ECS at nothing.
    - name: Verify image exists in ECR
      shell: bash
      run: |
        aws ecr describe-images \
          --repository-name "$ECR_REPOSITORY_NAME" \
          --image-ids imageTag="$IMAGE_TAG" \
          > /dev/null
        echo "Image $ECR_REPOSITORY_NAME:$IMAGE_TAG found, deploying to $ENVIRONMENT."

    # ECS_GITOPS_REPO is "owner/repo", but the app token's `repositories` input
    # takes bare repo names (the owner is passed separately).
    - name: Resolve gitops repo name
      id: gitops-repo
      shell: bash
      run: echo "name=${ECS_GITOPS_REPO#*/}" >> "$GITHUB_OUTPUT"

    # The CI bot credentials live in SSM, not in GitHub secrets. The AWS role
    # (AWS_ROLE_ARN) stays a GitHub secret: it is needed to reach SSM at all.
    - name: Load CI bot app id
      uses: ./.github/actions/load-ssm-secret
      with:
        parameter: /github/shared/ci_bot_app_id
        env-var: CI_BOT_APP_ID

    - name: Load CI bot private key
      uses: ./.github/actions/load-ssm-secret
      with:
        parameter: /github/shared/ci_bot_private_key
        env-var: CI_BOT_PRIVATE_KEY

    - name: Create gitops app token
      uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ env.CI_BOT_APP_ID }}
        private-key: ${{ env.CI_BOT_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.gitops-repo.outputs.name }}

    - name: Checkout gitops repo
      uses: actions/checkout@v5
      with:
        repository: ${{ env.ECS_GITOPS_REPO }}
        token: ${{ steps.app-token.outputs.token }}
        path: ${{ env.ECS_GITOPS_PATH }}
        ref: ${{ env.ENVIRONMENT }}

    - name: Configure Git
      shell: bash
      working-directory: ${{ env.ECS_GITOPS_PATH }}
      run: |
        git config --local user.email "automation@most.dev"
        git config --local user.name "Legacy Collect Deployment Automation"

    - name: Write image tag and push
      shell: bash
      run: task gitops:deploy
