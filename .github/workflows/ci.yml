name: CI Build on Pull Request

on:
  pull_request:
    branches: [ main, develop ] # develop is temporary until we can merge this to main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ECS_GITOPS_REPO: ${{ vars.ECS_GITOPS_REPO }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
  IMAGE_TAG: ${{ github.event.pull_request.head.sha }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  BUILD:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: task build

      - name: Push Image to ECR (for PR validation/testing)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: task push

      - name: Message success
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          BRANCH: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.number }}
        if: ${{ success() }}
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Docker Image is Ready! 💿 (\`${ process.env.IMAGE_TAG}\`)<br>Image will be deployed to the test environment when pull request to branch \`${process.env.BRANCH}\` is approved and merged.`,
            });

      - name: Message failure
        if: ${{ failure() }}
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Build failed! ❌ <br>${process.env.RUN_URL}`,
            });
