name: Promote image to prod

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [test, prod]
      image_tag:
        description: "Image tag to promote (the full 40-char commit SHA CI built)"
        required: true
        type: string

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # Service folder in the gitops repo: configs/<SERVICE_NAME>/vars/<env>.json.
  SERVICE_NAME: zitadel
  IMAGE_TAG: ${{ inputs.image_tag }}
  ENVIRONMENT: ${{ inputs.environment }}
  ECR_REPOSITORY_NAME: legacy-collect-zitadel
  ECS_GITOPS_PATH: ecs-gitops
  # Gitops repo as "owner/repo".
  ECS_GITOPS_REPO: ${{ github.repository_owner }}/legacy-collect-ecs-gitops

permissions:
  id-token: write
  contents: read

jobs:
  PROMOTE:
    runs-on: ubuntu-24.04
    # Binds the run to the GitHub Environment, which enforces its required-reviewer
    # approval before any step runs.
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      # image_tag is free-text input flowing into a privileged job (AWS OIDC +
      # gitops App token). Reject anything that is not a full commit SHA before it
      # is used anywhere. It is read from env, never inlined into the script.
      - name: Validate image tag
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be a full 40-char lowercase hex commit SHA" >&2
            exit 1
          fi
          echo "image_tag validated."

      - name: Initialize repository
        uses: actions/checkout@v5

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to gitops
        uses: ./.github/actions/gitops-deploy

      - name: Summary
        run: |
          echo "### Promoted \`$IMAGE_TAG\` to \`$ENVIRONMENT\` ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "The gitops \`$ENVIRONMENT\` branch now points at this image; ECS rolls it out." >> "$GITHUB_STEP_SUMMARY"
